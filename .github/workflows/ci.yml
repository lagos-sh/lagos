name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native-binaries.yml

  starter:
    name: Docker starters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before the next tag exists, test the starter against the last published
      # image. The release workflow tests it again against the new image.
      - run: docker build --pull --build-arg LAGOS_IMAGE=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-starter:ci examples/minimal
      - run: docker run --rm lagos-starter:ci validate
      - name: Extension builder and starter
        run: |
          docker build --target build -t lagos-builder:ci .
          docker run --rm -v "$PWD/examples/extension/ext:/work/ext:ro" lagos-builder:ci lagos-build /work/ext test
          docker build --build-arg LAGOS_BUILDER=lagos-builder:ci --build-arg LAGOS_RUNTIME=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-extension:ci examples/extension
          docker run --rm lagos-extension:ci validate
          bash tests/extension-smoke.sh lagos-extension:ci

      - name: Route-defaults starter on current source
        run: |
          docker build -t lagos-runtime:ci .
          docker build --build-arg LAGOS_IMAGE=lagos-runtime:ci -t lagos-defaults:ci examples/route-defaults
          docker run --rm lagos-defaults:ci validate

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

      # Tracing export is optional; the lean build must keep compiling.
      - run: cargo check --locked -p lagos-core --no-default-features
      - run: cargo test --locked -p lagos-core --no-default-features --lib
      - run: cargo check --locked -p lagos-core --no-default-features --features shared-limits
      - run: cargo check --locked -p lagos-core --no-default-features --features cache
      - run: cargo check --locked -p lagos-core --no-default-features --features otel

      - name: End-to-end suite
        run: ./tests/e2e/run.sh

      # Advisories, licences and sources. Was configured but never run, so a
      # licence the allow-list does not cover, or a new advisory, reached a
      # release unnoticed.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
