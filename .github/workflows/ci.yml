name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  starter:
    name: Docker starters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before the next tag exists, test the starter against the last published
      # image. The release workflow tests it again against the new image.
      - run: docker build --pull --build-arg LAGOS_IMAGE=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-starter:ci examples/minimal
      - run: docker run --rm lagos-starter:ci validate
      - name: Extension builder and starter
        run: |
          docker build --target build -t lagos-builder:ci .
          docker run --rm -v "$PWD/examples/extension/ext:/work/ext:ro" lagos-builder:ci lagos-build /work/ext test
          docker build --build-arg LAGOS_BUILDER=lagos-builder:ci --build-arg LAGOS_RUNTIME=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-extension:ci examples/extension
          docker run --rm lagos-extension:ci validate
          bash tests/extension-smoke.sh lagos-extension:ci

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Tracing export is optional; the lean build must keep compiling.
      - run: cargo check -p lagos-core --no-default-features

      - name: End-to-end suite
        run: ./tests/e2e/run.sh

      # Advisories, licences and sources. Was configured but never run, so a
      # licence the allow-list does not cover, or a new advisory, reached a
      # release unnoticed.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
