name: Release

# Publishes the stock `lagos` runtime and matching extension builder to GHCR
# on a version tag. The stock runtime has no application extensions compiled
# in; the builder links an app's ext/ crate to the same lagos-core source.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces lagos and lagos-builder images tagged 0.1.0, 0.1 and latest.
on:
  push:
    tags: ['v*']

# `packages: write` is what lets GITHUB_TOKEN push to ghcr.io — no PAT, no
# registry secret. `contents: read` narrows the default token everywhere else.
permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDER_IMAGE_NAME: ${{ github.repository }}-builder
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # A tag usually points at a commit main already tested, but "usually" is
      # not a property you want in a published artifact. This is the same suite
      # as ci.yml.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p lagos-core --no-default-features
      - name: End-to-end suite
        run: ./tests/e2e/run.sh

      - name: Two-file Docker starter
        run: |
          docker build --pull --build-arg LAGOS_IMAGE=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-starter:verify examples/minimal
          docker run --rm lagos-starter:verify validate

      - name: Extension builder and starter
        run: |
          docker build --target build -t lagos-builder:verify .
          docker run --rm -v "$PWD/examples/extension/ext:/work/ext:ro" lagos-builder:verify lagos-build /work/ext test
          docker build --build-arg LAGOS_BUILDER=lagos-builder:verify --build-arg LAGOS_RUNTIME=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-extension:verify examples/extension
          docker run --rm lagos-extension:verify validate
          bash tests/extension-smoke.sh lagos-extension:verify

      # Advisories, licences and sources. Was configured but never run, so a
      # licence the allow-list does not cover, or a new advisory, reached a
      # release unnoticed.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # The image is tagged from the git tag, but `lagos --version` reports the
      # crate version. If they disagree, :0.2.0 ships a binary that calls itself
      # 0.1.0 and every bug report cites the wrong version. Cheap to check here,
      # unfixable once pushed.
      - name: Tag matches crate version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lagos") | .version')
          tag="${GITHUB_REF_NAME#v}"
          echo "crate=$crate tag=$tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Native arm64 runner, free for public repos. This tree (aws-lc-sys,
          # cmake, bindgen, Pingora) is far too heavy to cross-build under QEMU
          # in a reasonable time. If arm64 runners ever become unavailable,
          # delete this entry rather than falling back to emulation.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Each architecture is pushed as an untagged manifest identified only by
      # its digest; the `merge` job below stitches them into one tagged manifest
      # list. Building both arches in one job would serialise them onto a single
      # runner instead.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # push-by-digest cannot carry attestations: they would be pushed as
          # extra manifests the merge step has no tag to attach them to.
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push extension builder by digest
        id: builder_build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false

      - name: Export builder digest
        run: |
          mkdir -p /tmp/builder-digests
          digest="${{ steps.builder_build.outputs.digest }}"
          touch "/tmp/builder-digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: builder-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/builder-digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/builder-digests
          pattern: builder-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No `{{major}}` while this is 0.x: a floating `0` tag would move
          # across 0.1 -> 0.2, which are not compatible with each other. Add it
          # at 1.0.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # A prerelease (v0.2.0-rc.1) publishes under its own tag but must not
          # become `latest`.
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          # SC2046 is the point here, not a bug: both substitutions must split
          # into separate argv entries -- one `-t` pair per tag, one trailing
          # ref per architecture digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Builder tags
        id: builder_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      - name: Publish extension builder manifest
        working-directory: /tmp/builder-digests
        run: |
          # One -t pair per tag and one digest reference per architecture.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect extension builder
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:${{ steps.builder_meta.outputs.version }}

      # Distroless has no shell, so this also proves the entrypoint resolves and
      # the binary's dynamic linkage is satisfied in the runtime image — the two
      # things a builder-stage test cannot tell you.
      - name: Smoke test
        run: |
          out=$(docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} --version)
          echo "$out"
          echo "$out" | grep -q "${GITHUB_REF_NAME#v}"

      - name: Smoke test two-file starter on published image
        run: |
          docker build --build-arg LAGOS_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -t lagos-starter:release examples/minimal
          docker run --rm lagos-starter:release validate

      - name: Smoke test extension starter on published images
        run: |
          docker build --build-arg LAGOS_BUILDER=${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:${{ steps.builder_meta.outputs.version }} --build-arg LAGOS_RUNTIME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -t lagos-extension:release examples/extension
          docker run --rm lagos-extension:release validate
          bash tests/extension-smoke.sh lagos-extension:release

      - name: Report
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.builder_meta.outputs.tags }}"
            echo '```'
            echo
            echo "    docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            echo "    docker pull ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:${{ steps.builder_meta.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
