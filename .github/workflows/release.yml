name: Release

# Publishes the stock `lagos` runtime and matching extension builder to GHCR
# on a version tag. The stock runtime has no application extensions compiled
# in; the builder links an app's ext/ crate to the same lagos-core source.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces lagos and lagos-builder images plus native Linux/macOS downloads.
on:
  push:
    tags: ['v*']

# `packages: write` is what lets GITHUB_TOKEN push to ghcr.io — no PAT, no
# registry secret. `contents: read` narrows the default token everywhere else.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDER_IMAGE_NAME: ${{ github.repository }}-builder
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # A tag usually points at a commit main already tested, but "usually" is
      # not a property you want in a published artifact. This is the same suite
      # as ci.yml.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p lagos-core --no-default-features
      - run: cargo test --locked -p lagos-core --no-default-features --lib
      - run: cargo check --locked -p lagos-core --no-default-features --features shared-limits
      - run: cargo check --locked -p lagos-core --no-default-features --features cache
      - run: cargo check --locked -p lagos-core --no-default-features --features otel
      - name: End-to-end suite
        run: ./tests/e2e/run.sh

      - name: Two-file Docker starter
        run: |
          docker build --pull --build-arg LAGOS_IMAGE=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-starter:verify examples/minimal
          docker run --rm lagos-starter:verify validate

      - name: Extension builder and starter
        run: |
          docker build --target build -t lagos-builder:verify .
          docker run --rm -v "$PWD/examples/extension/ext:/work/ext:ro" lagos-builder:verify lagos-build /work/ext test
          docker build --build-arg LAGOS_BUILDER=lagos-builder:verify --build-arg LAGOS_RUNTIME=ghcr.io/lagos-sh/lagos:0.1.3 -t lagos-extension:verify examples/extension
          docker run --rm lagos-extension:verify validate
          bash tests/extension-smoke.sh lagos-extension:verify

      - name: Route-defaults starter on current source
        run: |
          docker build -t lagos-runtime:verify .
          docker build --build-arg LAGOS_IMAGE=lagos-runtime:verify -t lagos-defaults:verify examples/route-defaults
          docker run --rm lagos-defaults:verify validate

      # Advisories, licences and sources. Was configured but never run, so a
      # licence the allow-list does not cover, or a new advisory, reached a
      # release unnoticed.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

      # The image is tagged from the git tag, but `lagos --version` reports the
      # crate version. If they disagree, :0.2.0 ships a binary that calls itself
      # 0.1.0 and every bug report cites the wrong version. Cheap to check here,
      # unfixable once pushed.
      - name: Tag matches crate version
        id: release_version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lagos") | .version')
          tag="${GITHUB_REF_NAME#v}"
          echo "crate=$crate tag=$tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      # Schemas are committed in the version tag, so their raw URLs are
      # available before images are published. Unit tests above detect drift.
      - name: Verify versioned editor schemas
        run: |
          for schema_file in gateway.schema.json routes.schema.json; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/lagos-sh/lagos/${GITHUB_REF_NAME}/schemas/${schema_file}" \
              --output "/tmp/${schema_file}"
            cmp "schemas/${schema_file}" "/tmp/${schema_file}"
          done

  native:
    needs: verify
    uses: ./.github/workflows/native-binaries.yml
    with:
      schema_release: ${{ needs.verify.outputs.version }}

  build:
    permissions:
      contents: read
      packages: write
    name: Build ${{ matrix.platform }}
    needs: [verify, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Native arm64 runner, free for public repos. This tree (aws-lc-sys,
          # cmake, bindgen, Pingora) is far too heavy to cross-build under QEMU
          # in a reasonable time. If arm64 runners ever become unavailable,
          # delete this entry rather than falling back to emulation.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "LAGOS_SCHEMA_RELEASE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Each architecture is pushed as an untagged manifest identified only by
      # its digest; the `merge` job below stitches them into one tagged manifest
      # list. Building both arches in one job would serialise them onto a single
      # runner instead.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: LAGOS_SCHEMA_RELEASE=${{ env.LAGOS_SCHEMA_RELEASE }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # push-by-digest cannot carry attestations: they would be pushed as
          # extra manifests the merge step has no tag to attach them to.
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push extension builder by digest
        id: builder_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: LAGOS_SCHEMA_RELEASE=${{ env.LAGOS_SCHEMA_RELEASE }}
          target: build
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false

      - name: Export builder digest
        run: |
          mkdir -p /tmp/builder-digests
          digest="${{ steps.builder_build.outputs.digest }}"
          touch "/tmp/builder-digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builder-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/builder-digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      contents: read
      packages: write
      # Provenance for the published manifest lists, signed with the job's
      # OIDC identity. Nothing else in this job uses either.
      id-token: write
      attestations: write
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/builder-digests
          pattern: builder-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No `{{major}}` while this is 0.x: a floating `0` tag would move
          # across 0.1 -> 0.2, which are not compatible with each other. Add it
          # at 1.0.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # A prerelease (v0.2.0-rc.1) publishes under its own tag but must not
          # become `latest`.
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          # SC2046 is the point here, not a bug: both substitutions must split
          # into separate argv entries -- one `-t` pair per tag, one trailing
          # ref per architecture digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        id: index
        run: |
          ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker buildx imagetools inspect "$ref"
          echo "digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # The per-architecture builds above set `provenance: false` because a
      # push-by-digest has no tag to hang attestations on. The manifest list is
      # what users pull, so it is attested here, after it exists, by digest.
      - name: Attest image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Builder tags
        id: builder_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      - name: Publish extension builder manifest
        working-directory: /tmp/builder-digests
        run: |
          # One -t pair per tag and one digest reference per architecture.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect extension builder
        id: builder_index
        run: |
          ref=${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:${{ steps.builder_meta.outputs.version }}
          docker buildx imagetools inspect "$ref"
          echo "digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - name: Attest extension builder
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          subject-digest: ${{ steps.builder_index.outputs.digest }}
          push-to-registry: true

      # Distroless has no shell, so this also proves the entrypoint resolves and
      # the binary's dynamic linkage is satisfied in the runtime image — the two
      # things a builder-stage test cannot tell you.
      - name: Smoke test
        run: |
          out=$(docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} --version)
          echo "$out"
          echo "$out" | grep -q "${GITHUB_REF_NAME#v}"

      - name: Smoke test schemas on published image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} schema > /tmp/runtime-gateway.schema.json
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} schema --routes > /tmp/runtime-routes.schema.json
          cmp schemas/gateway.schema.json /tmp/runtime-gateway.schema.json
          cmp schemas/routes.schema.json /tmp/runtime-routes.schema.json

      - name: Smoke test two-file starter on published image
        run: |
          docker build --build-arg LAGOS_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -t lagos-starter:release examples/minimal
          docker run --rm lagos-starter:release validate

      - name: Smoke test route-defaults starter on published image
        run: |
          docker build --build-arg LAGOS_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -t lagos-defaults:release examples/route-defaults
          docker run --rm lagos-defaults:release validate

      - name: Smoke test extension starter on published images
        run: |
          docker build --build-arg LAGOS_BUILDER=${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:${{ steps.builder_meta.outputs.version }} --build-arg LAGOS_RUNTIME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} -t lagos-extension:release examples/extension
          docker run --rm lagos-extension:release validate
          bash tests/extension-smoke.sh lagos-extension:release

      - name: Report
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.builder_meta.outputs.tags }}"
            echo '```'
            echo
            echo "    docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            echo "    docker pull ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:${{ steps.builder_meta.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"


  downloads:
    name: Publish standalone downloads
    needs: [native, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets
      - name: Prepare complete release assets
        run: |
          cp install.sh release-assets/install.sh
          python3 release/package.py checksums --directory release-assets --version "${GITHUB_REF_NAME#v}"
      - name: Attest standalone archives, installer and checksums
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release after all smoke checks
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != true ]; then
              echo 'Release already published; refusing to replace its standalone downloads.' >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false ;;
          esac
