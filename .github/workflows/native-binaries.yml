name: Native binaries

on:
  workflow_call:
    inputs:
      schema_release:
        description: Version tag already checked for matching published schemas
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      LAGOS_SCHEMA_RELEASE: ${{ inputs.schema_release }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'
      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'

      - name: Build static Linux executable
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: release/Dockerfile
          target: binary
          build-args: LAGOS_SCHEMA_RELEASE=${{ inputs.schema_release }}
          outputs: type=local,dest=native
          cache-from: type=gha,scope=native-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.target }}

      - name: Build macOS executable
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --bin lagos --target "$NATIVE_TARGET"
          mkdir -p native
          cp "target/$NATIVE_TARGET/release/lagos" native/lagos
          otool -L native/lagos > "$RUNNER_TEMP/lagos-linkage"
          tail -n +2 "$RUNNER_TEMP/lagos-linkage" | awk '{print $1}' | while IFS= read -r dependency; do
            case "$dependency" in
              /usr/lib/*|/System/Library/*) ;;
              *) echo "Non-system runtime dependency: $dependency" >&2; exit 1 ;;
            esac
          done
        env:
          NATIVE_TARGET: ${{ matrix.target }}

      - name: Smoke test native CLI and gateway
        run: python3 release/smoke.py --binary native/lagos --schema-release "$LAGOS_SCHEMA_RELEASE"

      - name: Test installers and package release archive
        run: |
          python3 release/test_install.py --binary native/lagos
          version=$(python3 -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("Cargo.toml").read(), re.M).group(1))')
          python3 release/package.py archive --binary native/lagos --version "$version" --target "$NATIVE_TARGET" --output native-assets
        env:
          NATIVE_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7
