<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300"
     font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">How Lagos handles a request</title>
  <desc id="d">A request passes through seven ordered stages — reject client credentials,
  canonicalize the path, deny-list, allowlist, verify token, extensions, inject credentials
  and identity — and is either proxied to a backing service or refused. Refusals leave the
  pipeline early, as 403, 404 or 401.</desc>

  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .stage { fill: #f4f6f8; stroke: #c9d1d9; }
    .label { fill: #1f2328; font-size: 12px; }
    .num   { fill: #6e7781; font-size: 10px; font-weight: 600; }
    .edge  { stroke: #8c959f; }
    .note  { fill: #6e7781; font-size: 11px; }
    .refuse{ fill: #b35900; font-size: 11px; font-weight: 600; }
    .ok    { fill: #1a7f37; font-size: 11px; font-weight: 600; }
    .pkt   { fill: #0969da; }
    .title { fill: #1f2328; font-size: 13px; font-weight: 700; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .stage { fill: #161b22; stroke: #30363d; }
      .label { fill: #e6edf3; }
      .num   { fill: #8b949e; }
      .edge  { stroke: #6e7681; }
      .note  { fill: #8b949e; }
      .refuse{ fill: #e3901f; }
      .ok    { fill: #3fb950; }
      .pkt   { fill: #58a6ff; }
      .title { fill: #e6edf3; }
    }

    /* Each stage lights up as the request reaches it. Seven stages over one
       loop, so each holds roughly a seventh of the cycle. */
    .stage { animation: idle 7s linear infinite; }
    @keyframes idle { 0%, 100% { opacity: 1 } }
    .lit { animation: lit 7s linear infinite; }
    @keyframes lit {
      0%, 100% { opacity: 0 }
      2%, 11%  { opacity: 1 }
      14%      { opacity: 0 }
    }
    .s2 { animation-delay: 1s }  .s3 { animation-delay: 2s }
    .s4 { animation-delay: 3s }  .s5 { animation-delay: 4s }
    .s6 { animation-delay: 5s }  .s7 { animation-delay: 6s }

    .pkt { animation: run 7s linear infinite; }
    @keyframes run {
      0%   { transform: translateX(0);   opacity: 0 }
      3%   { opacity: 1 }
      93%  { opacity: 1 }
      100% { transform: translateX(742px); opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .pkt, .lit, .stage { animation: none }
      .lit { opacity: 0 }
    }
  </style>

  <rect class="bg" width="980" height="300"/>
  <text class="title" x="16" y="26">A request through Lagos</text>

  <!-- ingress -->
  <text class="label" x="16" y="112">client</text>
  <text class="note"  x="16" y="128">TLS</text>
  <line class="edge" x1="60" y1="108" x2="96" y2="108" stroke-width="1.5" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8c959f"/>
    </marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1a7f37"/>
    </marker>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#b35900"/>
    </marker>
  </defs>

  <!-- seven stages -->
  <g id="stages">
    <g><rect class="stage" x="100" y="84" width="96" height="48" rx="6"/>
       <rect class="lit"   x="100" y="84" width="96" height="48" rx="6" fill="#0969da" opacity="0"/>
       <text class="num"   x="108" y="100">1</text>
       <text class="label" x="108" y="116">reject creds</text></g>

    <g><rect class="stage" x="206" y="84" width="96" height="48" rx="6"/>
       <rect class="lit s2" x="206" y="84" width="96" height="48" rx="6" fill="#0969da" opacity="0"/>
       <text class="num"   x="214" y="100">2</text>
       <text class="label" x="214" y="116">canonicalize</text></g>

    <g><rect class="stage" x="312" y="84" width="96" height="48" rx="6"/>
       <rect class="lit s3" x="312" y="84" width="96" height="48" rx="6" fill="#0969da" opacity="0"/>
       <text class="num"   x="320" y="100">3</text>
       <text class="label" x="320" y="116">deny-list</text></g>

    <g><rect class="stage" x="418" y="84" width="96" height="48" rx="6"/>
       <rect class="lit s4" x="418" y="84" width="96" height="48" rx="6" fill="#0969da" opacity="0"/>
       <text class="num"   x="426" y="100">4</text>
       <text class="label" x="426" y="116">allowlist</text></g>

    <g><rect class="stage" x="524" y="84" width="96" height="48" rx="6"/>
       <rect class="lit s5" x="524" y="84" width="96" height="48" rx="6" fill="#0969da" opacity="0"/>
       <text class="num"   x="532" y="100">5</text>
       <text class="label" x="532" y="116">verify token</text></g>

    <g><rect class="stage" x="630" y="84" width="96" height="48" rx="6"/>
       <rect class="lit s6" x="630" y="84" width="96" height="48" rx="6" fill="#0969da" opacity="0"/>
       <text class="num"   x="638" y="100">6</text>
       <text class="label" x="638" y="116">extensions</text></g>

    <g><rect class="stage" x="736" y="84" width="96" height="48" rx="6"/>
       <rect class="lit s7" x="736" y="84" width="96" height="48" rx="6" fill="#0969da" opacity="0"/>
       <text class="num"   x="744" y="100">7</text>
       <text class="label" x="744" y="116">inject identity</text></g>
  </g>

  <!-- the travelling request -->
  <circle class="pkt" cx="104" cy="72" r="5"/>

  <!-- egress: the arrow points into something, rather than off the edge -->
  <line class="edge" x1="836" y1="108" x2="866" y2="108" stroke-width="1.5" marker-end="url(#ao)" stroke="#1a7f37"/>
  <g>
    <rect class="stage" x="872" y="84" width="96" height="48" rx="6"/>
    <text class="label" x="880" y="104">services</text>
    <text class="note"  x="880" y="121">trusted headers</text>
  </g>
  <text class="ok" x="838" y="100">200</text>

  <!-- where a request leaves early -->
  <g stroke-width="1.2">
    <line class="edge" x1="148" y1="132" x2="148" y2="168" marker-end="url(#ar)" stroke="#b35900"/>
    <line class="edge" x1="254" y1="132" x2="254" y2="168" marker-end="url(#ar)" stroke="#b35900"/>
    <line class="edge" x1="360" y1="132" x2="360" y2="168" marker-end="url(#ar)" stroke="#b35900"/>
    <line class="edge" x1="466" y1="132" x2="466" y2="168" marker-end="url(#ar)" stroke="#b35900"/>
    <line class="edge" x1="572" y1="132" x2="572" y2="168" marker-end="url(#ar)" stroke="#b35900"/>
  </g>
  <text class="refuse" x="132" y="184">403</text>
  <text class="refuse" x="238" y="184">404</text>
  <text class="refuse" x="344" y="184">404</text>
  <text class="refuse" x="450" y="184">404</text>
  <text class="refuse" x="556" y="184">401</text>

  <text class="note" x="16" y="220">Every authorization decision happens in one place, in this order.</text>
  <text class="note" x="16" y="238">A refusal is always 404, never 403 — a distinguishable answer would let a caller enumerate the deny-list.</text>
  <text class="note" x="16" y="256">Client headers are dropped unless allowlisted; an upstream receives a header only because the config says so.</text>
</svg>
