[package]
name = "lagos-core"
description = "Identity-aware HTTP gateway built on Pingora: route allowlisting, JWT verification, and header-injected identity for internal services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pingora.workspace = true
pingora-prometheus.workspace = true
pingora-limits.workspace = true
async-trait.workspace = true
tokio.workspace = true
http.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
clap.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
x509-parser.workspace = true
humantime-serde.workspace = true
uuid.workspace = true
moka.workspace = true
arc-swap.workspace = true
ipnet.workspace = true
prometheus.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
anyhow.workspace = true
percent-encoding = "2"
base64 = "0.22"
subtle = "2.6.1"

[features]
default = ["otel", "cache"]
# OTLP trace export. Turn off for a smaller binary when traces are not collected.
cache = ["pingora/cache"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http"]

[lints]
workspace = true
